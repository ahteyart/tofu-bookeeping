<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tofu Bookkeeping</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#e3e3dc;--acc:#2f6f4f;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecece6;--mut:#9a9a92;--card:#1f1f1c;--line:#34342f;--acc:#6fbf91;--bad:#f2928b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:8px 0;flex:1}h2{font-size:16px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.stats div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.stats b{display:block;font-size:20px}.mut{color:var(--mut);font-size:13px}.bad{color:var(--bad)}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,monospace;font-size:13px}
button{cursor:pointer}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}button.link{border:0;background:none;color:var(--acc);padding:0;text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
iframe,img.prev{width:100%;height:360px;border:1px solid var(--line);border-radius:6px;margin-top:6px;object-fit:contain}
#login{max-width:340px;margin:60px auto}#login input{width:100%;margin:4px 0}[hidden]{display:none!important}
</style></head><body><main>
<section id="login" class="card" hidden>
  <h1>Tofu Bookkeeping</h1>
  <input id="email" type="email" placeholder="Email" autocomplete="username" aria-label="Email">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password">
  <div class="row"><button class="pri" id="signin">Sign in</button><span id="loginMsg" class="bad"></span></div>
</section>
<section id="app" hidden>
<header><h1>Tofu Bookkeeping</h1><span class="mut" id="who"></span><select id="client" aria-label="Client"></select><button id="signout">Sign out</button></header>
<div class="stats" id="stats"></div>
<h2>Submit a document</h2>
<div class="card">
  <div class="row"><select id="kind" aria-label="Kind"><option>invoice</option><option>receipt</option><option>bank_statement</option></select>
  <input id="file" type="file" accept="application/pdf,image/png,image/jpeg,image/webp,.csv,.txt" aria-label="File"></div>
  <details><summary class="mut">…or paste text (invoice fields or bank CSV)</summary>
  <textarea id="content" aria-label="Document text" placeholder="Supplier: …&#10;Invoice No: …&#10;Date: 2026-10-01&#10;Item | 1 | 100&#10;Tax: 0&#10;Total: 100"></textarea></details>
  <div class="row"><button class="pri" id="submit">Process</button><span class="mut" id="submitMsg"></span></div>
</div>
<h2>Review queue</h2><div id="queue"></div>
<h2>Recent documents</h2><div id="docs" class="card"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const el=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
let token=null;try{token=sessionStorage.getItem('tofu')}catch{}
async function raw(method,path,body){
  const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&token){token=null;show()}
  return r}
async function api(method,path,body){const r=await raw(method,path,body);const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j}
const cid=()=>$('client').value;
function show(){$('login').hidden=!!token;$('app').hidden=!token}
$('signin').onclick=async()=>{try{
  const r=await api('POST','/api/login',{email:$('email').value,password:$('password').value});
  token=r.token;try{sessionStorage.setItem('tofu',token)}catch{};$('password').value='';$('loginMsg').textContent='';show();init()}catch(e){$('loginMsg').textContent=e.message}};
$('signout').onclick=async()=>{try{await api('POST','/api/logout')}catch{};token=null;try{sessionStorage.removeItem('tofu')}catch{};show()};
async function load(){
  try{
    const [s,q,d]=await Promise.all([api('GET',`/api/clients/${cid()}/summary`),api('GET',`/api/clients/${cid()}/review`),api('GET',`/api/clients/${cid()}/documents`)]);
    $('stats').replaceChildren(...[['Documents',s.documents],['Posted',s.posted],['Needs review',s.needsReview],['Failed',s.failed],['Touchless',Math.round(s.automationRate*100)+'%'],['Bank matched',`${s.bankMatched}/${s.bankLines}`]].map(([a,b])=>el('div',{},el('b',{textContent:b}),el('span',{className:'mut',textContent:a}))));
    $('queue').replaceChildren(...(q.length?q.map(card):[el('p',{className:'mut',textContent:'Nothing to review.'})]));
    $('docs').replaceChildren(el('table',{},el('tr',{},...['File','Kind','Supplier','Total','Status'].map(h=>el('th',{textContent:h}))),
      ...d.slice(0,15).map(x=>el('tr',{},el('td',{textContent:x.filename}),el('td',{textContent:x.kind}),el('td',{textContent:x.supplier||''}),el('td',{textContent:x.total!=null?x.total.toFixed(2):''}),
        el('td',{className:x.status==='failed'?'bad':'',textContent:x.status+(x.error?` — ${x.error}`:'')})))));
  }catch(e){$('queue').replaceChildren(el('p',{className:'bad',textContent:e.message}))}}
function opts(list,label,sel,none){const s=el('select');s.append(el('option',{value:'',textContent:none}));
  list.forEach(o=>s.append(el('option',{value:o.id,textContent:label(o),selected:o.id===sel})));return s}
async function preview(it,box){
  const r=await raw('GET',`/api/documents/${it.documentId}/file`);if(!r.ok)return;
  const blob=await r.blob(),url=URL.createObjectURL(blob);
  box.replaceChildren(blob.type.startsWith('image/')?el('img',{className:'prev',src:url,alt:'Source document'}):el('iframe',{src:url,title:'Source document',sandbox:''}))}
function card(it){
  const ex=it.extraction,co=it.coding;
  const contact=opts(it.contacts,c=>c.name,co.contactId,'— choose supplier —');
  const rows=ex.lines.map((l,i)=>{
    const acc=opts(it.accounts,a=>`${a.code} ${a.name}`,co.lines[i].accountId,'— account —');
    const tax=opts(it.taxRates,t=>t.name,co.lines[i].taxRateId,'— tax —');
    return {acc,tax,tr:el('tr',{},el('td',{textContent:l.description}),el('td',{textContent:l.amount.toFixed(2)}),el('td',{},acc),el('td',{},tax))}});
  const msg=el('span',{className:'mut'}),box=el('div');
  const go=el('button',{className:'pri',textContent:'Approve & post',onclick:async()=>{try{
    const r=await api('POST',`/api/review/${it.id}/approve`,{contactId:contact.value||undefined,lines:rows.map(r=>({accountId:r.acc.value||undefined,taxRateId:r.tax.value||undefined}))});
    msg.textContent='Posting: '+r.status;load()}catch(e){msg.textContent=e.message;msg.className='bad'}}});
  const no=el('button',{textContent:'Reject',onclick:async()=>{await api('POST',`/api/review/${it.id}/reject`,{reason:'rejected in UI'});load()}});
  const view=el('button',{className:'link',textContent:'View original',onclick:()=>{view.remove();preview(it,box)}});
  return el('div',{className:'card'},
    el('div',{},el('b',{textContent:`${ex.supplier||'(unknown supplier)'} · ${ex.docNumber||'?'}`}),el('span',{className:'mut',textContent:` ${ex.docDate} · ${ex.currency} ${ex.total.toFixed(2)} · ${it.document.filename}`})),
    el('div',{className:'bad',textContent:it.reasons.join(' · ')}),
    el('div',{className:'row'},el('span',{className:'mut',textContent:'Supplier'}),contact,view),box,
    el('table',{},el('tr',{},...['Item','Amount','Account','Tax'].map(h=>el('th',{textContent:h}))),...rows.map(r=>r.tr)),
    el('div',{className:'row'},go,no,msg))}
const readB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
$('submit').onclick=async()=>{try{
  const f=$('file').files[0],kind=$('kind').value;let body;
  if(f&&/^(application\/pdf|image\/)/.test(f.type))body={kind,filename:f.name,mediaType:f.type,contentBase64:await readB64(f)};
  else if(f)body={kind,filename:f.name,content:await f.text()};
  else body={kind,filename:'pasted.txt',content:$('content').value};
  $('submitMsg').textContent='Processing…';
  const d=await api('POST',`/api/clients/${cid()}/documents`,body);
  $('submitMsg').textContent='Status: '+d.status+(d.error?` — ${d.error}`:'');$('file').value='';load()}catch(e){$('submitMsg').textContent=e.message}};
$('client').onchange=load;
async function init(){
  if(!token)return show();
  try{const me=await api('GET','/api/me');$('who').textContent=[me.email,me.firm].filter(Boolean).join(' · ')+(me.usage?` · ${me.usage.used}/${me.usage.limit} docs`:'');
    const cs=await api('GET','/api/clients');$('client').replaceChildren(...cs.map(c=>el('option',{value:c.id,textContent:c.name})));show();load()}catch{show()}}
init();
</script></body></html>
